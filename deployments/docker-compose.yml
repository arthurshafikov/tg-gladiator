    #         target: dev
    #     environment:
    #         WAIT_HOSTS: pgsql:5432
    #     depends_on: 
    #         - pgsql
    pgsql:
        image: postgres:16.3
        restart: on-failure
        ports:
            - "54401:5432"
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
    adminer:
        image: adminer
        restart: on-failure
        ports:
            - "54402:8080"
        depends_on:
            - pgsql
  
